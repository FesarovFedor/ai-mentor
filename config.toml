# Конфигурация Rust-версии "ИИ-наставника".

# Путь к локальной GGUF-модели для инференса.
# Пустой или битый путь -> приложение показывает экран "модель не найдена".
# Заполняется автоматически после выбора файла/успешной загрузки (или вручную).
model_path = 'D:\AI_tests\gguf_workspace\output_gguf_only\nanbeige4.2-3b-abliterated.Q4_K_M-imat.gguf'

# Плейсхолдер URL для скачивания GGUF-модели. Реальный адрес подставит
# человек позже; пока пусто — кнопка «скачать» на стартовом экране недоступна.
model_download_url = "https://huggingface.co/FesarovLab/ai-mentor-nanbeige4.2-3b/resolve/main/nanbeige4.2-3b-abliterated.Q4_K_M-imat.gguf"

# Опциональная контрольная сумма SHA-256 файла модели (проверяется
# после скачивания; пусто — проверка пропускается).
model_sha256 = ""
[embedding]
# Эмбеддер запросов: тот же, на котором собрана база (intfloat/multilingual-e5-small).
# В Rust инференс идёт через ONNX (fastembed-rs); веса скачиваются один раз в cache_dir.
model = "multilingual-e5-small"
cache_dir = ".models/fastembed"

[qdrant]
# Локальный Qdrant-сервер (gRPC). Готовая коллекция mentor_kb перенесена
# из local-mode базы предыдущей итерации без пересчёта эмбеддингов.
url = "http://127.0.0.1:6334"
collection = "mentor_kb"
top_k = 5

[generation]
# Параметры инференса (значения по умолчанию дублируют код; можно менять).
temperature = 0.7
# Бюджет генерации подобран по замерам на GPU (этап G, 11 генераций, seed=1234,
# логи logs/bench_stage_g.txt и logs/bench_long_kvq4.txt; пересчёт скриптом
# scripts/tmp_stats.ps1 -> logs/stage_g_stats_check.txt):
#   thinking: среднее 1830, sd 864, максимум 3105 токенов (mean+2сигма ~3557);
#   финальный ответ: среднее 1079, максимум 1539;
#   полная генерация: среднее 2951, максимум 4644 (естественный EOS, без обрывов).
# Расчёт: thinking 3557 (mean+2сигма) + ответ до 1540 (макс) + буфер ~400 = 5500.
# Старая рекомендация max_tokens=3000 из context_budget_report.md опровергнута
# замерами: при 3000 обрываются 4 из 11 прогонов (генерации 3871..4644).
# При смене модели на нон-reasoning можно уменьшить до ~2000.
max_tokens = 5500
# Окно: промпт RAG до ~2753 токенов (top_k=5) + бюджет ответа 5500 = 8253 —
# в 8192 уже НЕ помещается, поэтому окно поднято до 12288 (запас ~4000 под рост
# контекста/историю). Цена: KV Q4_0 396 -> 594 МиБ VRAM (+198), пик ~3.6 GiB
# из 8 GiB. n_ctx_train модели 262144 — ограничение не упирается.
n_ctx = 12288
# Формат промпта: chatml (instruct-модели Qwen и т.п.) или raw (как есть).
chat_template = "chatml"

[download]
# Куда класть скачанные файлы моделей (относительно config.toml).
dir = ".models/downloaded"

[kb_chunks]
# Исходные тексты чанков (только чтение). Тексты не хранятся в payload Qdrant —
# так же, как и в Python-версии.
files = [
    "../kb_chunks/chunks.jsonl",
    "../kb_chunks/run2_chunks.jsonl",
]
