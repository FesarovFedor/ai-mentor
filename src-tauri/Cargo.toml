[package]
name = "mentor-tauri"
version = "1.1.0"
edition = "2021"
description = "Tauri-оболочка десктоп-приложения 'ИИ-наставник'"

[lib]
name = "mentor_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Автозагрузка бинарных зависимостей бандла (Этап L5, см. build.rs):
sha2 = "0.10"
hex = "0.4"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
# parking_lot: мьютексы без "отравления" (нет panic-состояния) и быстрее
# std::sync::Mutex. Токен-мьютексы, удерживаемые через .await, остаются
# tokio::sync::Mutex (см. AppState).
parking_lot = "0.12"
# readiness-polling qdrant sidecar (GET /readiness)
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
anyhow = "1"
mentor-core = { path = "..", version = "1.1.0" }
rfd = "0.17.2"
